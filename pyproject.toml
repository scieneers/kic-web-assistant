[project]
name = "kic-web-assistant"
version = "0.1.0"
description = "System to guide the users of ki-campus.org"
authors = [
    {name = "Jonas Bremer", email = "jonas.bremer@scieneers.de"},
    {name = "Sebastian Drewke", email = "sebastian.drewke@scieneers.de"},
]
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "qdrant-client>=1.16.0",
    "llama-index==0.14.22",
    "llama-index-embeddings-azure-openai==0.5.2",
    "llama-index-llms-azure-openai==0.5.5",
    "llama-index-llms-openai-like==0.7.2",
    "llama-index-llms-azure-inference==0.7.0",
    "llama-index-callbacks-langfuse==0.5.0",
    "llama-index-vector-stores-qdrant==0.10.1",
    "llamaapi~=0.1.36",
    "langgraph>=1.0.0,<2",
    "langgraph-checkpoint>=2.0.0,<3",
    "langgraph-cli>=0.1.0,<1",
    "openai~=2.15.0",
    "python-dotenv~=1.0.1",
    # Self hosting llms
    "webvtt-py~=0.4.6",
    # Monitoring
    "langfuse~=2.43.1",
    "youtube-transcript-api~=0.6.2",
    "pydantic>=2.11.5",
    "azure-keyvault-secrets~=4.8.0",
    "lingua-language-detector>=2.0.2,<3",
    "retry>=0.9.2,<1",
    "openpyxl>=3.1.5,<4",
    "certifi>=2025.11.12",
    "pymupdf>=1.26.7,<2",
    # Linux (Docker/prod) gets the latest; macOS caps at 0.3.44, the last
    # release that still ships a macOS (universal2) wheel — 0.3.45 is Linux-only.
    "vosk>=0.3.45,<1; sys_platform == 'linux'",
    "vosk>=0.3.38,<0.3.45; sys_platform == 'darwin'",
    "ragas==0.3.8",
    "fastembed>=0.8.0,<1",
]

[project.optional-dependencies]
api = [
    "fastapi~=0.112.0",
    "uvicorn[standard]>=0.24.0.post1,<0.25",
    "gunicorn~=22.0.0",
]
azfunction = [
    "azure-functions>=1.21.3,<2",
    "azure-functions-durable>=1.2.9,<2",
    "requests~=2.32.5",
    "beautifulsoup4~=4.12.2",
    "azure-storage-blob>=12.26.0,<13",
]
frontend = [
    "streamlit~=1.29.0",
    "trubrics[streamlit]~=1.6.2",
    "streamlit-antd-components~=0.3.2",
]
ragas = [
    "langchain-openai~=1.1.7",
    "tiktoken~=0.12.0",
]

[dependency-groups]
dev = [
    "ipykernel~=6.26.0",
    "ipywidgets~=8.1.1",
    "pytest~=7.4.3",
    "pre-commit~=4.3.0",
    "mypy~=1.9.0",
    "types-requests~=2.31.0.20240311",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
plugins = [
  "pydantic.mypy"
]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
