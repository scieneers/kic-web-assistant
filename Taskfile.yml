version: '3'

vars:
  # Build for different architecture in case of arm processors
  TARGET: "linux"
  REGISTRY: "kicacrdev.azurecr.io"

tasks:
  print-vars:
    cmds:
      - |
        echo "TARGET: {{ .TARGET }}"
        echo "REGISTRY: {{ .REGISTRY }}"

  build-frontend:
    desc: Build the docker image for the streamlit frontend
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Building frontend with version {{.VERSION}}"
      - |
        {{ if eq .TARGET "linux" }}
          docker buildx build --load --platform linux/amd64 -t {{ .REGISTRY }}/app:{{.VERSION}} -f src/frontend/Dockerfile .
        {{ else }}
          docker build -t {{ .REGISTRY }}/app:{{.VERSION}} -f src/frontend/Dockerfile .
        {{ end }}

  build-api:
    desc: Build the docker image for the chatbot Rest API
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Building API with version {{.VERSION}}"
      - |
        {{ if eq .TARGET "linux" }}
          docker buildx build --load --platform linux/amd64 -t {{ .REGISTRY }}/rest-api:{{.VERSION}} -f src/api/Dockerfile .
        {{ else }}
          docker build -t {{ .REGISTRY }}/rest-api:{{.VERSION}} -f src/api/Dockerfile .
        {{ end }}
      - echo "Building API with version {{.VERSION}} - done."

  build-loader:
    desc: Build the docker image for the data loader (Azure Functions)
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Building loader with version {{.VERSION}}"
      - |
        {{ if eq .TARGET "linux" }}
          docker buildx build --load --platform linux/amd64 -t {{ .REGISTRY }}/loader:{{.VERSION}} -f src/loaders/Dockerfile .
        {{ else }}
          docker build -t {{ .REGISTRY }}/loader:{{.VERSION}} -f src/loaders/Dockerfile .
        {{ end }}

  push-frontend:
    desc: Push the frontend docker image. Version defaults to git commit hash if not provided.
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Pushing frontend with version {{.VERSION}}"
      - docker push {{ .REGISTRY }}/app:{{.VERSION}}

  push-api:
    desc: Push the API docker image. Version defaults to git commit hash if not provided.
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Pushing API with version {{.VERSION}}"
      - docker push {{ .REGISTRY }}/rest-api:{{.VERSION}}

  push-loader:
    desc: Push the loader docker image. Version defaults to git commit hash if not provided.
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Pushing loader with version {{.VERSION}}"
      - docker push {{ .REGISTRY }}/loader:{{.VERSION}}

  push-latest-images:
    desc: Pushes the docker images. Make sure to only push amd64 images. Version defaults to git commit hash if not provided.
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Pushing images with version {{.VERSION}}"
      - docker push {{ .REGISTRY }}/app:{{.VERSION}}
      - docker push {{ .REGISTRY }}/rest-api:{{.VERSION}}
      - docker push {{ .REGISTRY }}/loader:{{.VERSION}}

  az-login:
    desc: Login to azure using azure-cli
    cmds:
      - az login --tenant c6ff58bc-993e-4bdb-8d10-6013e2cd361f --scope https://graph.microsoft.com/.default
      - az acr login --name kicacrdev.azurecr.io

  deploy-loader:
    desc: "Promote a loader image onto the data-loader Function App. Usage: task deploy-loader ENV=dev [-- <version>]"
    vars:
      ENV: '{{.ENV | default "dev"}}'
      ACR: 'kicacr{{.ENV | default "dev"}}.azurecr.io'
      RESOURCE_GROUP: 'kic-aichat-{{.ENV | default "dev"}}'
      FUNCTION_APP: 'kic-dataloader-{{.ENV | default "dev"}}'
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Deploying loader {{.ACR}}/loader:{{.VERSION}} to {{.FUNCTION_APP}} ({{.RESOURCE_GROUP}})"
      - az functionapp config container set --name {{.FUNCTION_APP}} --resource-group {{.RESOURCE_GROUP}} --image {{.ACR}}/loader:{{.VERSION}}
      - az functionapp restart --name {{.FUNCTION_APP}} --resource-group {{.RESOURCE_GROUP}}

  deploy-api:
    desc: "Promote a api image to the API WebApp. Usage: task deploy-api ENV=dev [-- <version>]"
    vars:
      ENV: '{{.ENV | default "dev"}}'
      ACR: 'kicacr{{.ENV | default "dev"}}.azurecr.io'
      RESOURCE_GROUP: 'kic-aichat-{{.ENV | default "dev"}}'
      WEB_APP: 'kic-restapi-{{.ENV | default "dev"}}'
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Deploying api {{.ACR}}/rest-api:{{.VERSION}} to {{.WEB_APP}} ({{.RESOURCE_GROUP}})"
      - az webapp config container set --name {{.WEB_APP}} --resource-group {{.RESOURCE_GROUP}} --container-image-name {{.ACR}}/rest-api:{{.VERSION}}
      - az webapp restart --name {{.WEB_APP}} --resource-group {{.RESOURCE_GROUP}}

  deploy-frontend:
    desc: "Promote a frontend image to the Frontend WebApp. Usage: task deploy-frontend ENV=dev [-- <version>]"
    vars:
      ENV: '{{.ENV | default "dev"}}'
      ACR: 'kicacr{{.ENV | default "dev"}}.azurecr.io'
      RESOURCE_GROUP: 'kic-aichat-{{.ENV | default "dev"}}'
      WEB_APP: 'kic-frontend-{{.ENV | default "dev"}}'
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            git rev-parse --short HEAD
          fi
    cmds:
      - echo "Deploying Frontend {{.ACR}}/app:{{.VERSION}} to {{.WEB_APP}} ({{.RESOURCE_GROUP}})"
      - az webapp config container set --name {{.WEB_APP}} --resource-group {{.RESOURCE_GROUP}} --container-image-name {{.ACR}}/app:{{.VERSION}}
      - az webapp restart --name {{.WEB_APP}} --resource-group {{.RESOURCE_GROUP}}
